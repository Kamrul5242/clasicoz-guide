name: Weekly visibility monitor

on:
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run checks
        id: checks
        env:
          CHROME_PATH: /usr/bin/google-chrome
          # Optional. Each check is skipped (not failed) when its key is missing.
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: node scripts/monitor.mjs

      - name: Save report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          git commit -m "monitor: weekly report" || exit 0
          git pull --rebase
          git push

      # Anything failing -> one open issue titled "Monitor: problems found" (GitHub emails the owner).
      - name: Open or update issue
        if: steps.checks.outputs.failures != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --state open --search "Monitor: problems found in:title" --json number -q '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file reports/latest.md
          else
            gh issue create --title "Monitor: problems found" --body-file reports/latest.md
          fi
