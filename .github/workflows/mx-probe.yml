name: MX probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import smtplib
          for mx in ["mx1.emailowl.com","mx2.emailowl.com","mx3.emailowl.com","mx4.emailowl.com","mx5.emailowl.com","mx6.emailowl.com"]:
              try:
                  s = smtplib.SMTP(mx, 25, timeout=20)
                  s.ehlo("probe.guide.clasicoz.shop")
                  s.mail("probe@guide.clasicoz.shop")
                  a = s.rcpt("support@clasicoz.shop")
                  b = s.rcpt("nobody-probe-7731@clasicoz.shop")
                  s.quit()
                  print(mx, "support@:", a[0], a[1][:70], "| nobody@:", b[0], b[1][:50])
              except Exception as e:
                  print(mx, "ERROR", type(e).__name__, str(e)[:90])
          PY
