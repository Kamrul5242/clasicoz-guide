name: Build and deploy guide

on:
  schedule:
    - cron: '17 1,13 * * *' # twice a day, so new store products show up within ~12h
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Refresh the catalog from the live store. The runner image ships Google Chrome, which gets
      # through the store's JS challenge. If the store is unreachable the site is rebuilt from the
      # last good data in data/, so a bad fetch never takes the guide down.
      - name: Fetch live catalog
        id: fetch
        continue-on-error: true
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/fetch.mjs

      - name: Save refreshed data
        if: steps.fetch.outcome == 'success'
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "data: refresh catalog from clasicoz.shop"
            git push
          fi

      - run: node scripts/build.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Tell Bing (and other IndexNow engines) the guide changed. Never fails the run.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs && node scripts/indexnow.mjs || true
